name: Render grafiche
# Esegue i lavori jobs/render/*.json scritti dalle automazioni (decisione del 5 novembre 2026: nelle sessioni
# automatiche gli script del repository non si possono più eseguire, li esegue GitHub). Vedi render_jobs.py.
on:
  push:
    branches: [main]
    paths: ['jobs/render/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-grafiche
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strumenti e font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow opencv-python-headless onnxruntime
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          sudo cp assets/fonts/Poppins-*.ttf /usr/share/fonts/truetype/google-fonts/
      - name: Esegui i lavori in attesa
        run: python3 render_jobs.py
      - name: Salva i file prodotti
        run: |
          git config user.name "Andrea Bonazzi"
          git config user.email "andreabonazzi5@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "niente da salvare"; exit 0; fi
          git commit -q -m "Render grafiche: $(git diff --cached --name-only -- 'jobs/render/*.result.json' | xargs -n1 basename | tr '\n' ' ')"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 6; done
